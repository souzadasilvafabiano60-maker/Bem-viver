<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Perfil - Bem Viver</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header class="navbar">

    <a href="{{ url_for('index') }}"
       class="logo">

        <span>♡</span>
        Bem <b>Viver</b>

    </a>

    <nav>

        <a href="{{ url_for('dashboard') }}">
            Meu espaço
        </a>

        <a href="{{ url_for('diario') }}">
            Diário
        </a>

        <a href="{{ url_for('perfil') }}">
            Perfil
        </a>

        <a href="{{ url_for('logout') }}"
           class="btn-nav">
            Sair
        </a>

    </nav>

</header>


<main class="page narrow">

    <div class="page-heading">

        <span class="tag">
            MINHA CONTA
        </span>

        <h1>
            Meu perfil
        </h1>

        <p>
            Atualize suas informações
            quando quiser.
        </p>

    </div>


    <section class="panel profile-card">

        <div class="avatar">

            {{ usuario_perfil["nome"][0]|upper }}

        </div>


        <form method="POST">

            <label>
                Nome

                <input
                    type="text"
                    name="nome"
                    value="{{ usuario_perfil['nome'] }}"
                    required
                >

            </label>


            <label>
                E-mail

                <input
                    type="email"
                    name="email"
                    value="{{ usuario_perfil['email'] }}"
                    required
                >

            </label>


            <button
                type="submit"
                class="btn-primary">

                Salvar alterações

            </button>

        </form>

    </section>

</main>

</body>
</html>
